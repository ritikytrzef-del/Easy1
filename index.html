<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Adsgptpro - Powered by Reward Software</title>
    
    <script src="https://ad.gigapub.tech/script?id=5478"></script>
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            /* Blue & Purple Gradient for Balance Card */
            --balance-gradient: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            --button-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            --text-black: #0f172a;
            --text-grey: #64748b;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0 15px 160px 15px; background: #ffffff; color: var(--text-black); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }

        .header { padding: 30px 0 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Updated Balance Card Color */
        .card-large { 
            background: var(--balance-gradient); 
            padding: 30px 25px; 
            border-radius: 32px; 
            color: white; 
            margin: 10px 0 25px; 
            box-shadow: 0 15px 35px rgba(37, 117, 252, 0.3); 
        }
        .bal-usdt { font-size: 38px; font-weight: 800; margin: 10px 0; }
        .bal-inr { font-size: 16px; font-weight: 600; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 50px; display: inline-block; }

        .goal-card { background: #f8fafc; padding: 20px; border-radius: 24px; border: 1px solid #f1f5f9; margin-bottom: 20px; }
        .progress-container { height: 10px; background: #e2e8f0; border-radius: 50px; overflow: hidden; margin-top: 10px; }
        .progress-bar { height: 100%; background: var(--balance-gradient); width: 0%; transition: 1s ease; }

        .ads-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .ad-card { background: #ffffff; border: 1px solid #f1f5f9; border-radius: 24px; padding: 20px 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        .btn-watch { width: 100%; border: none; background: var(--button-gradient); color: white; padding: 12px; border-radius: 14px; font-weight: 700; cursor: pointer; }

        /* Navigation & Footer Styling */
        .footer-fixed { 
            position: fixed; 
            bottom: 100px; /* Above nav buttons */
            left: 0; 
            right: 0; 
            text-align: center; 
            font-size: 11px; 
            font-weight: 700; 
            color: #94a3b8; 
            letter-spacing: 1px;
            pointer-events: none;
        }

        .nav-fixed { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #ffffff; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding: 15px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 460px; margin: auto; z-index: 999; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 11px; font-weight: 600; text-align: center; }
        .nav-btn.active { color: #2575fc; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* History Status Styles */
        .hist-item { background:#f8fafc; padding:15px; border-radius:18px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border: 1px solid #f1f5f9; }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 50px; font-weight: 700; }
        .status-success { background: #ecfdf5; color: #059669; }
        .status-pending { background: #fffbeb; color: #b45309; }
        
        #overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 10000; }
    </style>
</head>
<body>

    <div id="overlay"><div style="text-align:center;"><i class="fa-solid fa-spinner fa-spin" style="font-size:40px; color:#2575fc;"></i><p>LOADING...</p></div></div>

    <div class="footer-fixed">POWERED BY REWARD SOFTWARE</div>

    <div class="container">
        <div class="header">
            <div>
                <h2 style="margin:0;">Adsgptpro</h2>
                <div id="greeting-user" style="font-size: 13px; color: var(--text-grey); font-weight: 600;"></div>
            </div>
            <div style="font-size: 10px; font-weight: 800; color: #2575fc;">OFFICIAL APP</div>
        </div>

        <div id="home-view" class="view active">
            <div class="card-large">
                <div style="font-size: 12px; opacity: 0.8; font-weight: 600;">AVAILABLE BALANCE</div>
                <div class="bal-usdt" id="display-usdt">0.0000 USDT</div>
                <div class="bal-inr" id="display-inr">₹ 0.00</div>
            </div>
            <div class="goal-card">
                <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px;">
                    <span>Daily Progress</span>
                    <span id="goal-percent">0%</span>
                </div>
                <div class="progress-container"><div class="progress-bar" id="goal-bar"></div></div>
            </div>
            <div style="text-align:center; color:gray; font-size:12px;">
                Today: <span id="today-count">0</span>/100 Ads
            </div>
        </div>

        <div id="ads-view" class="view">
            <h4 style="margin:0 0 15px 5px; color:var(--text-grey);">Earn Money</h4>
            <div class="ads-container" id="slots-container"></div>
        </div>

        <div id="wallet-view" class="view">
            <h4 style="margin:0 0 15px 5px; color:var(--text-grey);">Withdraw</h4>
            <div class="wallet-card" style="padding: 20px; border: 1px solid #eee; border-radius: 20px; margin-bottom: 10px;" onclick="selectWay('faucetpay', 0.005, 'USDT', 'Faucetpay Email', 0, 1)">
                <b>Faucetpay</b><br><small>Instant Processing</small>
            </div>
            <div id="withdraw-form" style="display:none; padding:20px; background:#f8fafc; border-radius:20px;">
                <input type="text" id="p-info" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;" placeholder="Details">
                <input type="number" id="p-amt" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;" placeholder="Amount">
                <button onclick="submitRequest()" style="width:100%; padding:15px; background:var(--balance-gradient); color:white; border:none; border-radius:12px; font-weight:bold;">SUBMIT</button>
            </div>
        </div>

        <div id="history-view" class="view">
            <h4 style="margin:0 0 15px 5px; color:var(--text-grey);">Activity History</h4>
            <div id="history-list"></div>
        </div>
    </div>

    <div class="nav-fixed">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><br>Home</button>
        <button class="nav-btn" onclick="switchTab('ads', this)"><i class="fa-solid fa-play"></i><br>Ads</button>
        <button class="nav-btn" onclick="switchTab('wallet', this)"><i class="fa-solid fa-wallet"></i><br>Wallet</button>
        <button class="nav-btn" onclick="switchTab('history', this)"><i class="fa-solid fa-history"></i><br>History</button>
    </div>

    <script>
        const CONFIG = { AD_VAL: 0.0002, INR_RATE: 88, DAILY_LIMIT: 100 };
        let db = JSON.parse(localStorage.getItem('adpro_v10')) || {
            balance: 0, totalAds: 0, todayAds: 0, history: [], date: new Date().toLocaleDateString()
        };

        const tg = window.Telegram.WebApp;
        tg.ready();

        function updateUI() {
            document.getElementById('display-usdt').innerText = db.balance.toFixed(4) + ' USDT';
            document.getElementById('display-inr').innerText = '₹ ' + (db.balance * CONFIG.INR_RATE).toFixed(2);
            document.getElementById('today-count').innerText = db.todayAds;
            let p = (db.todayAds / CONFIG.DAILY_LIMIT) * 100;
            document.getElementById('goal-bar').style.width = p + '%';
            document.getElementById('goal-percent').innerText = Math.round(p) + '%';
            localStorage.setItem('adpro_v10', JSON.stringify(db));
        }

        function loadAds() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            for(let i=1; i<=4; i++) {
                container.innerHTML += `<div class="ad-card"><b>Ads ${i}</b><br><small>+$0.0002</small><br><br><button class="btn-watch" onclick="watchAd()">Watch</button></div>`;
            }
        }

        function watchAd() {
            if(db.todayAds >= CONFIG.DAILY_LIMIT) return alert("Limit reached!");
            db.balance += CONFIG.AD_VAL;
            db.todayAds++;
            db.history.unshift({ type: 'earn', amount: CONFIG.AD_VAL, time: Date.now() });
            updateUI();
            alert("Reward added!");
        }

        function selectWay(m, min, cur, p) {
            document.getElementById('withdraw-form').style.display = 'block';
            document.getElementById('p-info').placeholder = p;
        }

        function submitRequest() {
            const amt = parseFloat(document.getElementById('p-amt').value);
            if(amt > db.balance) return alert("Low balance");
            db.balance -= amt;
            db.history.unshift({ type: 'withdraw', amount: amt, time: Date.now(), method: 'Faucetpay' });
            updateUI();
            alert("Withdrawal submitted!");
        }

        function switchTab(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id + '-view').classList.add('active');
            el.classList.add('active');
            if(id === 'ads') loadAds();
            if(id === 'history') renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const now = Date.now();
            list.innerHTML = db.history.map(h => {
                const isSuccess = (now - h.time) > (24 * 60 * 60 * 1000);
                if(h.type === 'earn') {
                    return `<div class="hist-item"><div><b style="color:green">+ $${h.amount.toFixed(4)}</b><br><small>Ad Reward</small></div><span class="status-badge status-success">Success</span></div>`;
                } else {
                    return `<div class="hist-item"><div><b style="color:red">- $${h.amount.toFixed(4)}</b><br><small>${h.method}</small></div><span class="status-badge ${isSuccess ? 'status-success' : 'status-pending'}">${isSuccess ? 'Success' : 'Pending (24h)'}</span></div>`;
                }
            }).join('') || '<p style="text-align:center;">No history.</p>';
        }

        window.onload = updateUI;
    </script>
</body>
</html>
